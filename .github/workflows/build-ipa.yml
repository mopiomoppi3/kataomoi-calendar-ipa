name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build (unsigned)
        run: |
          xcodebuild -project KataomoiCalendar.xcodeproj \
            -scheme KataomoiCalendar \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "build/Build/Products/Release-iphoneos/KataomoiCalendar.app/Info.plist")
          mkdir -p Payload
          cp -r "build/Build/Products/Release-iphoneos/KataomoiCalendar.app" Payload/
          zip -r "KataomoiCalendar-v${VERSION}.ipa" Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KataomoiCalendar-unsigned
          path: KataomoiCalendar-v*.ipa
